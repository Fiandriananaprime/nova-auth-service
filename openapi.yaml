openapi: 3.0.3
info:
  title: Nova Market Auth Service
  description: System and monitoring endpoints for the authentication service.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
    description: Service health, readiness, version, and metrics

paths:
  /health:
    get:
      tags: [System]
      summary: Check service liveness
      operationId: getHealth
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [System]
      summary: Check service readiness
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'

  /version:
    get:
      tags: [System]
      summary: Get service version information
      operationId: getVersion
      responses:
        '200':
          description: Current service version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /metrics:
    get:
      tags: [System]
      summary: Get Prometheus metrics
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready]
        checks:
          type: object
          additionalProperties:
            type: string

    NotReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [not_ready]
        checks:
          type: object
          additionalProperties:
            type: string

    VersionResponse:
      type: object
      required: [service, version, commit]
      properties:
        service:
          type: string
        version:
          type: string
        commit:
          type: string
